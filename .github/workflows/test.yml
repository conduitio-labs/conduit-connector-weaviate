name: Tests

on:
  # Pushes made by GITHUB_TOKEN (dependabot auto-merge) do not trigger the
  # push event, so without a schedule main is never tested after a merge.
  schedule:
    - cron: '53 4 * * 1'
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Unit tests
        run: make test GOTEST_FLAGS="-v -count=1"

      - name: Integration tests
        env:
          OPENAI_APIKEY: ${{ secrets.OPENAI_APIKEY }}
        run: make test-integration GOTEST_FLAGS="-v -count=1"
